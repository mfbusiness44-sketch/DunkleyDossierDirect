<script>
(function () {
  const STANCE = {
    industry: { label: 'Advocates for the forest industry', token: '--st-industry' },
    transition: { label: 'Mixed or transition-focused', token: '--st-transition' },
    conservation: { label: 'Conservation-focused', token: '--st-conservation' },
    unknown: { label: 'Researched, no position found', token: '--st-unknown' }
  };
  const SHARE_BINS = [35, 50, 65, 80];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (n) => n == null ? '' : Number(n).toLocaleString('en-CA');
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // Views: 'mayors' (municipalities, the default) and 'rd' (regional district electoral areas) in BC Local Leaders;
  // 'fn' in FN Partners, where the election areas are hidden and partner First Nations are pinned.
  let DATA = null, layer = null, mode = 'mayors', selected = null, section = 'home';
  const activeIn = (p) => (mode === 'mayors' ? p.type === 'muni' : mode === 'rd' ? p.type === 'ea' : false);

  const map = L.map('map', { preferCanvas: true, zoomControl: false, attributionControl: true, minZoom: 3, maxZoom: 13, zoomSnap: 0.25 });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  map.attributionControl.setPrefix('');
  map.attributionControl.addAttribution('Boundaries, roads, cities: <a href="https://catalogue.data.gov.bc.ca/" target="_blank" rel="noopener">DataBC</a> (OGL-BC) · Results: <a href="https://localelections.ca/results/" target="_blank" rel="noopener">CivicInfo BC</a> · Imagery: NASA Blue Marble');
  map.fitBounds([[48.2, -139.1], [60.0, -114.0]]);
  map.createPane('base'); map.getPane('base').style.zIndex = 200;
  L.imageOverlay('bluemarble.jpg', [[47.8, -139.5], [60.4, -113.5]], { pane: 'base', interactive: false, alt: 'Satellite view of British Columbia' }).addTo(map);
  const renderer = L.canvas({ padding: 0.3, tolerance: 4 });
  map.createPane('pins'); map.getPane('pins').style.zIndex = 480;
  ['roads', 'labels'].forEach((n, i) => { map.createPane(n); const el = map.getPane(n); el.style.zIndex = 450 + i * 10; el.style.pointerEvents = 'none'; });
  const roadRenderer = L.svg({ pane: 'roads', padding: 0.5 });

  // Highways: a dark casing under a light line, both widening as you zoom in. Minor roads appear from zoom 6.
  let roadsCasing = null, roadsLine = null;
  function roadStyle(f, casing) {
    const z = map.getZoom(), c = f.properties.cls;
    if (c === 'ferry') return casing ? { opacity: 0, weight: 0 } : { color: css('--ferry'), weight: 1.5, opacity: 0.9, dashArray: '4 5', interactive: false };
    if (c === 'minor' && z < 6) return { opacity: 0, weight: 0 };
    const w = c === 'major' ? Math.min(6, Math.max(1.4, (z - 3) * 0.8)) : Math.min(3.5, Math.max(0.8, (z - 4) * 0.5));
    return { color: casing ? css('--road-casing') : css(c === 'major' ? '--road' : '--road-minor'), weight: casing ? w + 2.2 : w, opacity: casing ? 0.55 : 0.95, lineCap: 'round', lineJoin: 'round', interactive: false };
  }
  function buildRoads(geo) {
    const opts = (casing) => ({ renderer: roadRenderer, pane: 'roads', interactive: false, style: (f) => roadStyle(f, casing) });
    roadsCasing = L.geoJSON(geo, opts(true)).addTo(map);
    roadsLine = L.geoJSON(geo, opts(false)).addTo(map);
  }
  function restyleRoads() {
    if (!roadsLine) return;
    roadsCasing.eachLayer((l) => l.setStyle(roadStyle(l.feature, true)));
    roadsLine.eachLayer((l) => l.setStyle(roadStyle(l.feature, false)));
  }

  // Map labels, in priority order:
  //   cities: unchanged; the largest show first and smaller ones appear as you zoom in
  //   regional district names (Regional Districts view only, hidden when zoomed far in)
  //   towns and communities: only once zoomed in (8.5+), localities from 10+
  // Text grows with zoom; a label that would overlap a higher-priority one is hidden.
  // Markers are created only while visible, so thousands of town names stay cheap.
  const CITY_MIN_ZOOM = { 1: 0, 2: 5, 3: 6.75, 4: 8, 5: 8.5, 6: 10 };
  const CITY_BASE = { 1: 13, 2: 12, 3: 11, 4: 10.5, 5: 10, 6: 9.5 };
  let labels = [];
  function addLabels(list, kind) {
    for (const c of list) labels.push({ c, kind, m: null });
    labels.sort((a, b) => rank(a) - rank(b));
    placeLabels();
  }
  const rank = (l) => (l.kind === 'city' ? l.c.t : l.kind === 'rd' ? 4.5 : l.kind === 'forest' ? (l.c.t === 'tsa' ? 4.6 : 4.7) : 10 + l.c.t);   // cities keep priority
  function fontFor(l, z) {
    if (l.kind === 'rd') return Math.round(Math.min(11 + Math.max(0, z - 5) * 1.2, 15));
    if (l.kind === 'forest') return l.c.t === 'tsa' ? Math.round(Math.min(10.5 + Math.max(0, z - 5) * 1.1, 14)) : Math.round(Math.min(10.5 + Math.max(0, z - 6.5) * 0.9, 13));
    const b = CITY_BASE[l.c.t];
    if (l.kind === 'town') return Math.round(Math.min(b + Math.max(0, z - 8.5) * 0.8, b + 3));

  }
  function visibleAt(l, z) {
    if (l.kind === 'rd') return mode === 'rd' && z < 9;

  }
  function markerFor(l) {
    if (!l.m) {
      const html = l.kind === 'rd' || l.kind === 'forest' ? `<span>${esc(l.c.n)}</span>` : `<i></i><span>${esc(l.c.n)}</span>`;
      l.m = L.marker([l.c.lat, l.c.lon], { pane: 'labels', interactive: false, keyboard: false,
        icon: L.divIcon({ className: l.kind === 'rd' ? 'rdlabel' : l.kind === 'forest' ? (l.c.t === 'tsa' ? 'rdlabel' : 'tfllabel' + (l.c.dk ? ' dk' : '')) : 'city t' + l.c.t, html, iconSize: null }) });
    }
    return l.m;
  }
  function placeLabels() {
    const z = map.getZoom(), size = map.getSize(), boxes = [];
    if (section === 'fn') for (const { n } of pins) {   // pin names first, so town labels never cover them
      const pt = map.latLngToContainerPoint([n.lat, n.lon]);
      boxes.push([pt.x - 12, pt.y - 12, pt.x + 18 + shortName(n).length * 13 * 0.6, pt.y + 12]);
    }
    for (const l of labels) {
      let show = visibleAt(l, z), fs = 0;
      if (show) {
        fs = fontFor(l, z);
        const pt = map.latLngToContainerPoint([l.c.lat, l.c.lon]);
        const w = l.c.n.length * fs * (l.kind === 'rd' || (l.kind === 'forest' && l.c.t === 'tsa') ? 0.95 : 0.62);   // spaced capitals are wider
        const box = l.kind === 'rd' || l.kind === 'forest' ? [pt.x - w / 2, pt.y - fs * 0.8, pt.x + w / 2, pt.y + fs * 0.8]

      }

        const m = markerFor(l);
        if (!map.hasLayer(m)) m.addTo(map);

      }
    }
  }

  // Regional district boundaries (Regional Districts view only): a light line on a dark casing.

  function showRD() {

  const head = (p) => p.officials[0];

  // Returns [colour, fillOpacity]. Fills stay translucent so the satellite image shows through.

  function fillFor(p) {
    if (!activeIn(p)) return [css('--land-muni'), mode === 'rd' && p.type === 'muni' ? 0.22 : 0];

  function restyle() {

    showRD(); placeLabels();
    const sl = selected && layerByKey[selected];

    renderLegend();
  }

  function renderLegend() {

          <label><input type="checkbox" data-layer="tfl" ${forestOn.tfl ? 'checked' : ''}><span class="sw" style="background:rgba(255,138,31,.45);border:1.5px solid #ff9a3c"></span>Tree Farm Licences (TFL)</label>
          <div class="row" style="padding-left:21px"><span class="sw" style="background:rgba(0,134,81,.55);border:1.5px solid #00a866"></span>Dunkley Lumber TFL</div>
        </div>`;
    } else if (mode === 'mayors') {
      lg.innerHTML = `<div style="font-size:12px;color:var(--ink-2)">161 municipalities · share of the vote won by each mayor</div>${ramp}`;
    } else {
      lg.innerHTML = `<div style="font-size:12px;color:var(--ink-2)">159 electoral areas in 27 regional districts · share of the vote won by each area director</div>${ramp}
        <div class="row"><span class="ln rd"></span>Regional district boundary</div>
        <div class="row"><span class="sw" style="background:color-mix(in srgb, ${css('--land-muni')} 30%, transparent)"></span>Municipality (see Mayoral Overview)</div>`;

  }

  function personCard(o, lead, compact) {
    const pr = o.profile;
    const votes = o.votes === 0 ? 'Acclaimed' : `${fmt(o.votes)} votes${o.pct != null && o.office !== 'Councillor' ? ' · ' + o.pct + '%' : ''}`;
    let body = '';
    if (pr) {
      const st = STANCE[pr.forestry.stance];
      body += `<p>${esc(pr.summary)}</p>`;
      if (pr.priorities && pr.priorities.length) body += `<div><h4>Main objectives</h4><ul>${pr.priorities.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>`;
      body += `<div class="forestry"><h4>Forestry</h4><span class="chip"><i style="background:${css(st.token)}"></i>${esc(st.label)}</span><p>${esc(pr.forestry.summary)}</p>${pr.forestry.highlights.length ? `<ul>${pr.forestry.highlights.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;

    }

    return `<article class="person${lead ? ' lead' : ''}"><div class="person-top"><div><div class="role">${esc(o.office)}${o.org ? ' · ' + esc(o.org) : ''}</div><h3>${esc(o.name)}</h3></div><div class="votes">${votes}${prev}</div></div>${body}</article>`;
  }

  // ---- Local Forestry News ----
  // In the app, headlines are fetched natively from Google News for each area, cached on the phone,
  // and refreshed the first time an area is opened in each app session or once the cache is a day old.
  // The web page cannot reach outside sites, so it shows a search link instead.
  const NEWS_TERMS = '(forestry OR forest OR sawmill OR mill OR logging OR timber OR lumber OR "wood products")';
  const NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
  const DAY = 864e5;
  const PWA = !!window.BCLL_PWA;
  let dailyNewsPromise = null;
  function dailyNews() {
    if (!dailyNewsPromise) dailyNewsPromise = fetch('news.json', { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    dailyNewsPromise.catch(() => { dailyNewsPromise = null; });
    return dailyNewsPromise;
  }
  const refreshedThisSession = new Set();
  function rdShort(rd) {
    const s = (rd || '').replace(/\s*\(Regional District\)$/, '').replace(/^Regional District of\s+/i, '').replace(/\s+Regional District$/i, '');
    return s === 'Capital' ? 'Capital Regional District' : s;
  }
  const RESOURCE_TERMS = '(forest OR forestry OR logging OR timber OR mill OR "natural resources" OR mining OR mine OR minerals OR pipeline OR LNG OR oil OR gas OR hydro OR "Site C" OR wildfire OR "land use" OR stewardship OR "government-to-government" OR treaty OR agreement OR reconciliation OR election OR chief OR council OR premier OR minister OR politics)';
  function newsQueries(p) {
    if (p.type === 'fn') {
      const label = shortName(p);
      return { label, rd: null, names: p.newsNames.concat([p.name, label]), topic: 'forests, resources or politics',
               local: `(${p.newsNames.map((x) => `"${x}"`).join(' OR ')}) ${RESOURCE_TERMS} when:365d`, regional: null };
    }
    const rd = rdShort(p.rd || p.jurisdiction);
    let local, label;
    if (p.type === 'muni') { local = `"${p.name}" ("B.C." OR BC OR "British Columbia")`; label = p.name; }
    else {
      const m = p.name.match(/\((.*)\)$/);
      const locs = m ? m[1].split(/\s*[\/,]\s*|\s+and\s+/).map((x) => x.trim()).filter((x) => x.length > 2).slice(0, 4) : [];
      local = locs.length ? `(${locs.map((x) => `"${x}"`).join(' OR ')})` : `"${rd}"`;
      label = locs.length ? locs.join(', ') : rd;
    }
    const names = [p.name.replace(/\s*\(.*\)$/, ''), rd].concat(label.split(', '));
    return { label, rd, names, topic: 'forestry', local: `${local} ${NEWS_TERMS} when:120d`, regional: `"${rd}" ${NEWS_TERMS} when:120d` };
  }
  const rssUrl = (q) => 'https://news.google.com/rss/search?q=' + encodeURIComponent(q) + '&hl=en-CA&gl=CA&ceid=CA:en';
  const searchUrl = (q) => 'https://news.google.com/search?q=' + encodeURIComponent(q) + '&hl=en-CA&gl=CA&ceid=CA:en';
  async function fetchRss(q, scope) {
    const r = await fetch(rssUrl(q));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const doc = new DOMParser().parseFromString(await r.text(), 'text/xml');
    return [...doc.querySelectorAll('item')].map((it) => {
      const txt = (sel) => { const n = it.querySelector(sel); return n ? n.textContent.trim() : ''; };
      const outlet = txt('source');
      let title = txt('title');
      if (outlet && title.endsWith(' - ' + outlet)) title = title.slice(0, -(outlet.length + 3));
      return { title, outlet, url: txt('link'), t: Date.parse(txt('pubDate')) || 0, scope };
    }).filter((x) => x.title && /^https:\/\//.test(x.url));
  }
  // Google matches outlet names too ("Burns Lake Lakes District News"), so keep only headlines that are about forestry.
  const FORESTRY_RE = /\b(forest\w*|sawmills?|mills?|logging|loggers?|logs|timber|lumber|wood|woodlots?|softwood|pulp|fibre|fiber|tenures?|harvest\w*|reforest\w*|silvicultur\w*|stumpage|old[- ]growth|cutblocks?|cutting permits?|planers?|pellets?|biomass|truck loggers?|COFI)\b/i;
  const RESOURCE_RE = new RegExp(FORESTRY_RE.source.replace(')\\b', '|minings?|mines?|minerals?|pipelines?|LNG|oil|gas|hydro|dams?|Site C|wildfires?|land[- ]use|stewardship|resources?|caribou|energy|government\\w*|G2G|treat(?:y|ies)|reconciliation|agreements?|accords?|MOUs?|elections?|elected|chiefs?|council\\w*|premier|ministers?|ministry|MLAs?|MPs?|politic\\w*|polic(?:y|ies)|DRIPA|UNDRIP|title|rights|legislat\\w*|Parliament|negotiat\\w*|funding|investment)\\b'), 'i');
  async function loadNews(p) {
    const q = newsQueries(p);
    const TOPIC_RE = p.type === 'fn' ? RESOURCE_RE : FORESTRY_RE;
    // Ignore the area's own place names (e.g. "Mill Bay") when deciding if a headline is about forestry.
    const strip = (t) => q.names.reduce((acc, n) => (n ? acc.split(n).join(' ') : acc), t);
    const relevant = (list) => list.filter((i) => TOPIC_RE.test(strip(i.title)));
    let items = relevant(await fetchRss(q.local, 'local'));
    if (items.length < 4 && q.regional) {
      const seen = new Set(items.map((i) => i.title));
      items = items.concat(relevant(await fetchRss(q.regional, 'regional')).filter((i) => !seen.has(i.title)));
    }
    items.sort((a, b) => (a.scope === b.scope ? 0 : a.scope === 'local' ? -1 : 1) || b.t - a.t);
    const seenTitles = new Set();   // the same story often runs in several outlets
    items = items.filter((i) => { const k = i.title.toLowerCase().replace(/\W+/g, ' ').trim(); if (seenTitles.has(k)) return false; seenTitles.add(k); return true; });
    return { t: Date.now(), items: items.slice(0, p.type === 'fn' ? 8 : 6) };
  }
  const cacheKey = (k) => 'bcll-news-' + k;
  function readCache(k) { try { const v = JSON.parse(localStorage.getItem(cacheKey(k)) || 'null'); return v && Array.isArray(v.items) ? v : null; } catch (e) { return null; } }
  function writeCache(k, v) { try { localStorage.setItem(cacheKey(k), JSON.stringify(v)); } catch (e) {} }
  function ago(t) {
    const m = Math.round((Date.now() - t) / 6e4);
    if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
    const h = Math.round(m / 60); if (h < 24) return h + ' h ago';
    const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d < 30 ? d + ' days ago' : new Date(t).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
  }
  const background = (p) => p.context ? `<div class="context"><b>Background:</b> ${esc(p.context.text)}</div>` : '';
  function paintNews(p, data, note) {
    const el = $('news'); if (!el || selected !== p.key) return;
    const q = newsQueries(p);
    const list = data.items.length
      ? data.items.map((i) => `<a class="story" href="${esc(i.url)}" target="_blank" rel="noopener"><span class="hl">${esc(i.title)}</span><span class="src">${esc(i.outlet)}${i.t ? ' · ' + ago(i.t) : ''}${i.scope === 'regional' ? ` · <span class="tag">${esc(q.rd)} region</span>` : ''}</span></a>`).join('')
      : `<div class="pending">No ${q.topic} stories ${p.type === 'fn' ? 'in the past year' : 'in the last four months'} mention ${esc(q.label)}.</div>${background(p)}`;
    el.innerHTML = list + `<div class="news-foot">${note || 'Updated ' + ago(data.t)} · Google News</div>`;
  }
  async function showNews(p) {
    const el = $('news'); if (!el) return;
    const q = newsQueries(p);
    if (!NATIVE && PWA) {
      // iPhone / web app: headlines are gathered daily on GitHub (Safari cannot read Google News directly).
      el.innerHTML = '<div class="pending">Loading the latest forestry news…</div>';
      try {
        const all = await dailyNews();
        const a = all.areas && all.areas[p.key];
        if (!a) throw new Error('no entry');
        paintNews(p, { t: all.updated, items: a.items }, `Updated ${ago(all.updated)} · refreshed daily`);
      } catch (e) {
        if (selected === p.key) el.innerHTML = `${background(p)}<a class="story" href="${esc(searchUrl(q.local))}" target="_blank" rel="noopener"><span class="hl">Latest ${q.topic} news for ${esc(q.label)}</span><span class="src">Opens Google News</span></a>`;
      }
      return;
    }
    if (!NATIVE) {
      el.innerHTML = `${background(p)}<a class="story" href="${esc(searchUrl(q.local))}" target="_blank" rel="noopener"><span class="hl">Latest ${q.topic} news for ${esc(q.label)}</span><span class="src">Opens Google News</span></a><div class="news-foot">Live headlines load automatically in the Android and iPhone apps.</div>`;
      return;
    }
    const cached = readCache(p.key);
    if (cached) paintNews(p, cached, refreshedThisSession.has(p.key) ? null : 'Checking for new stories…');
    else el.innerHTML = '<div class="pending">Loading the latest forestry news…</div>';
    if (cached && refreshedThisSession.has(p.key) && Date.now() - cached.t < DAY) return;
    try {
      const data = await loadNews(p);
      refreshedThisSession.add(p.key); writeCache(p.key, data); paintNews(p, data);
    } catch (e) {
      if (selected !== p.key) return;
      if (cached) paintNews(p, cached, `Offline · showing stories saved ${ago(cached.t)}`);
      else el.innerHTML = `<div class="pending">News could not load. Check your connection and open this area again.</div>${background(p)}`;
    }
  }

  // ---- App updates (Android app only) ----
  // The app's loader starts the newest copy it has: a downloaded update or the one built into the APK.
  // Here we check GitHub for a newer map/data bundle and download it in the background, and check
  // whether a newer APK has been published (which still needs the user to tap Install).
  const UPD = window.BCLL_UPDATE || null;
  function idb() {
    return new Promise((res, rej) => { const r = indexedDB.open('bcll-ota', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  }
  async function idbPut(k, v) { const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  function updateBar(id, html, onGo) {
    let box = document.getElementById('updates');
    if (!box) { box = document.createElement('div'); box.id = 'updates'; box.className = 'updates'; document.body.appendChild(box); }
    let bar = document.getElementById(id);
    if (!bar) { bar = document.createElement('div'); bar.id = id; bar.className = 'update-bar'; bar.setAttribute('role', 'status'); box.appendChild(bar); }
    bar.innerHTML = html + '<button class="x" aria-label="Dismiss">×</button>';
    bar.querySelector('.x').onclick = () => bar.remove();
    if (onGo) bar.querySelector('.go').onclick = onGo;
  }
  async function checkForUpdates() {
    if (!NATIVE || !UPD || !UPD.base) return;

    let man;
    try { const r = await fetch(UPD.base + UPD.ota + 'manifest.json?t=' + Date.now()); if (!r.ok) return; man = await r.json(); } catch (e) { return; }
    const running = window.BCLL_OTA_BUILD || UPD.build;
    let bad = []; try { bad = JSON.parse(localStorage.getItem('bcll-ota-bad') || '[]'); } catch (e) {}
    if (man.build > running && !bad.includes(man.build) && Array.isArray(man.files)) {
      try {
        const files = {};
        for (const name of man.files) {
          const r = await fetch(UPD.base + UPD.ota + name + '?b=' + man.build);
          if (!r.ok) throw new Error(name);
          const text = await r.text();
          if (name.endsWith('.json') || name.endsWith('.geojson')) JSON.parse(text);   // reject truncated downloads
          else if (!text.includes('<\/script>')) throw new Error(name);   // escaped so this inline script is not cut short
          files[name] = text;

  // ---- Timber Supply Areas (TSA) and Tree Farm Licences (TFL) with allowable annual cut, in FN Partners ----

  // Partner Nations whose pinned community sits inside an area (ray casting on the simplified boundary)

  function inGeom(x, y, g) { const polys = g.type === 'Polygon' ? [g.coordinates] : g.coordinates; return polys.some((p) => inRing(x, y, p[0]) && !p.slice(1).some((h) => inRing(x, y, h))); }

  function closeSheet() { $('sheet').hidden = true; $('sheet').classList.remove('tall'); selected = null; restyle(); markPins(); restyleForest(); history.replaceState(null, '', section === 'fn' ? '#fn' : '#map'); }

  }
  function fitAll() {
    const narrow = window.innerWidth <= 720;
    map.fitBounds(layer.getBounds(), { paddingTopLeft: [narrow ? 10 : 370, narrow ? 130 : 20], paddingBottomRight: [10, 10] });
  }

  // Search
  let index = [];
  function buildIndex() {
    Object.values(DATA.places).forEach((p) => {
      index.push({ section: 'leaders', key: p.key, label: p.name, sub: p.type === 'muni' ? `${p.kind}${p.rd ? ' · ' + p.rd : ''}` : (p.rd || p.jurisdiction), hay: (p.name + ' ' + (p.rd || '')).toLowerCase() });
      p.officials.forEach((o) => index.push({ section: 'leaders', key: p.key, label: o.name, sub: `${o.office}, ${p.name}`, hay: (o.name + ' ' + o.fullName).toLowerCase() }));
    });
  }
  let active = -1, hits = [];
  function search(q) {
    const r = $('results'); q = q.trim().toLowerCase();
    if (q.length < 2) { r.hidden = true; return; }
    hits = index.filter((x) => x.section === section && x.hay.includes(q)).sort((a, b) => (a.hay.startsWith(q) ? 0 : 1) - (b.hay.startsWith(q) ? 0 : 1)).slice(0, 8);
    active = -1;
    r.innerHTML = hits.length ? hits.map((x, i) => `<button role="option" data-i="${i}">${esc(x.label)}<small>${esc(x.sub)}</small></button>`).join('') : `<div style="padding:10px;color:var(--ink-2)">No matches</div>`;
    r.hidden = false;
  }
  function choose(i) { const x = hits[i]; if (!x) return; $('results').hidden = true; $('q').value = x.label; $('q').blur(); (/^(tsa|tfl)\d+$/.test(x.key) ? openForest : x.section === 'fn' ? openNation : openPlace)(x.key, { zoom: true }); }
  $('q').addEventListener('input', (e) => search(e.target.value));
  $('q').addEventListener('keydown', (e) => {
    const btns = [...$('results').querySelectorAll('button')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); active = (active + (e.key === 'ArrowDown' ? 1 : -1) + btns.length) % btns.length; btns.forEach((b, i) => b.classList.toggle('active', i === active)); }
    else if (e.key === 'Enter') { e.preventDefault(); choose(active < 0 ? 0 : active); }
    else if (e.key === 'Escape') { $('results').hidden = true; }
  });
  $('results').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) choose(+b.dataset.i); });
  document.addEventListener('click', (e) => { if (!e.target.closest('.search')) $('results').hidden = true; });

  function switchMode(m) {
    if (mode === m) return;
    mode = m;
    const sp = selected && DATA.places[selected];
    if (sp && !activeIn(sp)) closeSheet(); else restyle();
  }
  $('legend').addEventListener('change', (e) => {
    const k = e.target.dataset && e.target.dataset.layer; if (!k) return;
    forestOn[k] = e.target.checked;
    if (!forestOn[k] && selected && selected.startsWith(k)) closeSheet();
    restyleForest(); placeLabels();
  });
  $('modeMayors').addEventListener('click', () => switchMode('mayors'));
  $('modeRD').addEventListener('click', () => switchMode('rd'));
  $('close').addEventListener('click', closeSheet);
  $('handle').addEventListener('click', () => { $('sheet').classList.toggle('tall'); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
  $('toggleCard').addEventListener('click', () => { const c = $('card'); const col = c.classList.toggle('collapsed'); $('toggleCard').textContent = col ? 'Legend' : 'Hide'; $('toggleCard').setAttribute('aria-expanded', !col); });
  if (window.innerWidth <= 720) { $('card').classList.add('collapsed'); $('toggleCard').textContent = 'Legend'; $('toggleCard').setAttribute('aria-expanded', 'false'); }

  // Theme changes: re-read tokens and repaint canvas
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);
  window.addEventListener('hashchange', () => {
    const k = location.hash.slice(1); if (!k || k === selected) return;
    if (DATA && DATA.places[k]) openPlace(k, { zoom: true });
    else if (FN && FN.nations[k]) openNation(k, { zoom: true });
    else if (forestByKey[k]) openForest(k, { zoom: true });
  });

  const optional = (url) => fetch(url).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  Promise.all([fetch('places.json').then((r) => r.json()), fetch('places.geojson').then((r) => r.json()), optional('roads.geojson'), optional('cities.json'), optional('towns.json'), optional('rd.geojson'), optional('rd_labels.json'), optional('fn.json'), optional('forest.geojson')]).then(([data, geo, roads, cities, towns, rd, rdNames, fnData, forest]) => {
    DATA = data; buildIndex(); build(geo);
    if (roads) buildRoads(roads);
    if (rd) buildRD(rd);
    addLabels(cities || [], 'city'); addLabels(towns || [], 'town'); addLabels(rdNames || [], 'rd');
    if (fnData) buildPins(fnData);
    if (forest) buildForest(forest);
    renderStat();
    $('loading').remove();
    setTimeout(checkForUpdates, 1500);
    if (PWA) setTimeout(iosInstallHint, 2500);
    const k = location.hash.slice(1);
    if (k && data.places[k]) openPlace(k, { zoom: true });
    else if (k && FN && FN.nations[k]) openNation(k, { zoom: true });
    else if (k && forestByKey[k]) openForest(k, { zoom: true });
  }).catch((err) => { $('loading').textContent = 'The map data did not load. Reload the page to try again.'; console.error(err); });
})();
</script>
</body></html>
